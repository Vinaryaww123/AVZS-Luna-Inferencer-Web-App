# Render Blueprint: full app with accounts and a persistent disk.
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: avzs-luna-inferencer
    runtime: docker
    plan: starter          # paid plan: required for a persistent disk. Use "free" only for a temporary demo.
    region: singapore
    healthCheckPath: /api/health
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: DATA_DIR
        value: /var/data
      - key: COOKIE_SECURE
        value: "1"
      - key: TRUST_PROXY
        value: "1"
      - key: ALLOW_LOCAL_TOOLS
        value: "0"
      - key: ALLOW_GUEST
        value: "1"
    disk:
      name: luna-data
      mountPath: /var/data
      sizeGB: 1
