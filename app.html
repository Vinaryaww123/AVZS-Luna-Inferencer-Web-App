<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AVZS Luna Inferencer</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/app.css"> <!-- Tailwind build output: python scripts/build.py css -->
</head>
<body class="mx-auto flex h-dvh max-w-4xl flex-col bg-bg font-sans text-[15px] leading-relaxed text-tx">
<!-- Top bar: left = brand, right = actions (icons only on small screens, icon + text on wide screens) -->
<header class="flex flex-wrap items-center gap-2 px-3.5 pb-1 pt-3">
  <a href="index.html" class="hbtn" title="Back to main menu" aria-label="Back to main menu"><svg viewBox="0 0 24 24" class="h-4 w-4 shrink-0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg><span class="hidden lg:inline">Main menu</span></a>
  <a href="index.html" class="mr-auto flex items-center gap-2 px-1" title="Home"><img data-brand="logo" alt="" class="h-7 w-7"><h1 data-brand="name" class="text-[17px] font-semibold tracking-tight"></h1></a>
  <a href="models.html" class="hbtn" title="PC specifications and local models" aria-label="Local models"><svg viewBox="0 0 24 24" class="h-4 w-4 shrink-0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="2"/><rect x="9" y="9" width="6" height="6"/><path d="M9 2v2M15 2v2M9 20v2M15 20v2M2 9h2M2 15h2M20 9h2M20 15h2"/></svg><span class="hidden lg:inline">Local models</span></a>
  <button id="tourBtn" type="button" class="hbtn" title="Tutorial" aria-label="Tutorial"><svg viewBox="0 0 24 24" class="h-4 w-4 shrink-0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M9.1 9a3 3 0 0 1 5.8 1c0 2-3 3-3 3"/><path d="M12 17h.01"/></svg><span class="hidden lg:inline">Tutorial</span></button>
  <button id="acct" type="button" class="btn h-9 max-w-[11rem] truncate px-3" title="Account">Sign in</button>
  <button id="cfg" type="button" class="hbtn" title="Provider settings and keys" aria-label="Settings"><svg viewBox="0 0 24 24" class="h-4 w-4 shrink-0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h2M10 12h10M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="8" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg><span class="hidden lg:inline">Settings</span></button>
</header>
<!-- Mode tabs: segmented control, scrollable on narrow screens (populated by js/ui.js) -->
<nav id="nav" aria-label="Task type" class="mx-3.5 mt-1 flex gap-1 overflow-x-auto rounded-xl bg-cd p-1"></nav>
<div class="flex flex-wrap items-center gap-2 px-3.5 pb-1 pt-3">
  <select id="prov" aria-label="Provider" class="field"></select>
  <div class="relative min-w-[150px] flex-1">
    <input id="mdl" placeholder="Model name (click to choose, or type)" aria-label="Model" autocomplete="off" role="combobox" aria-expanded="false" aria-controls="mlist" class="field w-full">
    <div id="mlist" role="listbox" class="absolute left-0 right-0 top-full z-20 mt-1 hidden max-h-64 overflow-auto rounded-lg border border-bd bg-sf p-1 shadow-lg"></div>
  </div>
  <button id="ld" class="btn" title="Load the model list from the provider">Load models</button>
</div>
<main id="main" class="min-h-0 flex-1 overflow-auto px-3.5 py-1.5"></main>
<button id="jump" class="btn btn-pri fixed bottom-32 right-5 hidden rounded-full px-3 py-1 text-sm shadow-lg">Jump to bottom</button>
<footer class="px-3.5 pb-3.5 pt-2">
  <details id="advBox" class="group mb-2 hidden rounded-lg border border-bd bg-sf">
    <summary class="flex cursor-pointer items-center justify-between gap-2 px-3 py-2 text-sm"><span id="advTitle" class="font-medium">Advanced settings</span><svg viewBox="0 0 24 24" class="h-4 w-4 text-mu transition-transform group-open:rotate-180" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></summary>
    <div id="adv" class="grid max-h-56 gap-2 overflow-auto border-t border-bd p-3 sm:grid-cols-3"></div>
    <p id="advHint" class="hidden px-3 pb-2 text-xs text-mu"></p>
  </details>
  <!-- Composer: one card containing tab options (empty = hidden) and the message field -->
  <div class="rounded-2xl border border-bd bg-sf p-2 shadow-sm transition-colors focus-within:border-ac">
    <div id="opt" class="mb-2 flex flex-wrap items-center gap-2 px-1 text-[13px] text-mu empty:hidden"></div>
    <div id="composer" class="flex items-end gap-2">
      <textarea id="in" rows="1" aria-label="Message" class="max-h-40 min-w-0 flex-1 resize-none bg-transparent px-2 py-1.5 focus:outline-none"></textarea>
      <button id="go" class="btn btn-pri h-9 px-4">Send</button>
    </div>
  </div>
</footer>

<dialog id="dlg" class="m-auto max-h-[90dvh] w-[min(560px,94vw)] overflow-auto rounded-2xl border border-bd bg-sf p-4 text-tx backdrop:bg-black/50">
  <h3 class="text-base font-semibold">Providers and keys</h3>
  <div class="mt-2 flex gap-1"><button id="gCloud" type="button" class="tab tab-on">Cloud</button><button id="gLocal" type="button" class="tab">Local</button><button id="gMcp" type="button" class="tab">MCP</button></div>
  <div id="pvs" class="mt-2 grid gap-1.5"></div>
  <div class="mt-2 grid gap-1.5 border-t border-bd pt-2.5"><b class="font-semibold">Logo</b><label class="filebtn w-fit"><svg viewBox="0 0 24 24" class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m21.4 11.1-9.2 9.2a6 6 0 0 1-8.5-8.5l9.2-9.2a4 4 0 0 1 5.7 5.7l-9.2 9.2a2 2 0 0 1-2.8-2.8l8.5-8.5"/></svg>Choose logo<input type="file" id="logoFile" accept="image/*" class="sr-only"></label><button id="logoReset" class="btn w-fit">Restore default logo</button></div>
  <p class="mt-2 text-[12.5px] text-mu">API keys are stored in this browser (and in your account if you are signed in) and sent directly to the provider.</p>
  <div class="mt-2.5 text-right"><button id="cl" class="btn btn-pri">Done</button></div>
</dialog>

<dialog id="prev" class="m-auto h-[80dvh] w-[min(900px,96vw)] overflow-hidden rounded-2xl border border-bd bg-sf p-0 text-tx backdrop:bg-black/50">
  <div class="flex items-center justify-between border-b border-bd px-3 py-2 text-sm"><b>Preview</b><button id="prevClose" type="button" class="btn px-2 py-1 text-sm">Close</button></div>
  <iframe id="prevFrame" title="Preview" sandbox="allow-scripts" class="h-[calc(80dvh-3rem)] w-full bg-white"></iframe>
</dialog>

<dialog id="mcpOk" class="m-auto w-[min(440px,94vw)] rounded-2xl border border-bd bg-sf p-4 text-tx backdrop:bg-black/50">
  <h3 class="text-base font-semibold">Allow tool call?</h3>
  <p class="mt-1 text-sm text-mu">The model requests to run <b id="mcpOkName" class="text-tx"></b> with these arguments:</p>
  <pre id="mcpOkArgs" class="mt-2 max-h-48 overflow-auto whitespace-pre-wrap rounded-lg bg-cd p-2 text-xs"></pre>
  <div class="mt-3 flex flex-wrap justify-end gap-2"><button type="button" class="btn" data-r="deny">Deny</button><button type="button" class="btn" data-r="always">Allow for session</button><button type="button" class="btn btn-pri" data-r="allow">Allow</button></div>
</dialog>

<!-- Order matters: brand -> env -> config -> auth -> api -> ui -> tour -->
<script src="js/brand.js"></script>
<script src="js/env.js"></script>
<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script src="js/api.js"></script>
<script src="js/ui.js"></script>
<script src="js/tour.js"></script>
</body>
</html>
