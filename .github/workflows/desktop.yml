name: Build desktop app (Windows)

# Manual build: Actions -> "Build desktop app (Windows)" -> Run workflow.
# The executable is attached to the run as a downloadable artifact.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install desktop dependencies
        run: pip install -r requirements-desktop.txt
      - name: Build executable
        run: python scripts/build_desktop.py
      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: avzs-luna-inferencer-windows
          path: dist-desktop/AVZS Luna Inferencer.exe
          if-no-files-found: error
