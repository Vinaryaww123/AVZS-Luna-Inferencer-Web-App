<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Masuk — AVZS Luna Inferencer</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body class="grid min-h-dvh place-items-center bg-bg px-4 py-8 font-sans text-[15px] leading-relaxed text-tx">
<main class="w-full max-w-sm">
  <!-- Merek: nama, tagline, dan logo diatur di js/brand.js -->
  <div class="mb-6 text-center">
    <img data-brand="logo" alt="" class="mx-auto mb-3 h-14 w-14">
    <h1 data-brand="name" class="text-2xl font-semibold tracking-tight"></h1>
    <p id="lsub" class="mt-1 text-sm text-mu">Masuk untuk melanjutkan ke aplikasi</p>
  </div>

  <div class="card p-5">
    <div class="mb-4 flex gap-1" role="tablist">
      <button id="tLogin" type="button" role="tab" class="tab tab-on">Masuk</button>
      <button id="tReg" type="button" role="tab" class="tab">Daftar</button>
    </div>
    <form id="lform" class="grid gap-3">
      <label class="grid gap-1 text-sm text-mu">Nama pengguna
        <input id="lu" class="field text-tx" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus>
      </label>
      <label class="grid gap-1 text-sm text-mu">Kata sandi
        <input id="lp" type="password" class="field text-tx" autocomplete="current-password" required>
      </label>
      <label class="hidden gap-1 text-sm text-mu [&:not(.hidden)]:grid">Ulangi kata sandi
        <input id="lp2" type="password" class="field text-tx" autocomplete="new-password">
      </label>
      <p id="lhint" class="hidden text-xs text-mu">Nama pengguna 3-32 karakter: huruf, angka, titik, strip, atau garis bawah. Kata sandi minimal 8 karakter.</p>
      <label class="flex items-center gap-1.5 text-sm text-mu"><input id="lshow" type="checkbox" class="accent-ac"> Tampilkan kata sandi</label>
      <p id="lmsg" class="hidden text-sm" role="alert"></p>
      <button id="lsubmit" class="btn btn-pri py-2">Masuk</button>
    </form>
  </div>

  <div id="guestBox" class="mt-4 text-center text-sm">
    <a id="guest" href="app.html" class="text-ac hover:underline">Lanjut tanpa akun</a>
    <p class="mt-1 text-xs text-mu">Tanpa akun, pengaturan hanya tersimpan di browser ini.</p>
  </div>
  <p class="mt-3 text-center text-sm"><a href="index.html" class="text-mu hover:text-tx">Kembali ke beranda</a></p>
</main>
<script src="js/brand.js"></script>
<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script src="js/login.js"></script>
</body>
</html>
