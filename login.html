<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign in — AVZS Luna Inferencer</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body class="grid min-h-dvh place-items-center bg-bg px-4 py-8 font-sans text-[15px] leading-relaxed text-tx">
<main class="w-full max-w-sm">
  <!-- Brand: name, tagline, and logo are configured in js/brand.js -->
  <div class="mb-6 text-center">
    <img data-brand="logo" alt="" class="mx-auto mb-3 h-14 w-14">
    <h1 data-brand="name" class="text-2xl font-semibold tracking-tight"></h1>
    <p id="lsub" class="mt-1 text-sm text-mu">Sign in to continue to the app</p>
  </div>

  <div class="card p-5">
    <div class="mb-4 flex gap-1" role="tablist">
      <button id="tLogin" type="button" role="tab" class="tab tab-on">Sign in</button>
      <button id="tReg" type="button" role="tab" class="tab">Register</button>
    </div>
    <form id="lform" class="grid gap-3">
      <label class="grid gap-1 text-sm text-mu">Username
        <input id="lu" class="field text-tx" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus>
      </label>
      <label class="grid gap-1 text-sm text-mu">Password
        <input id="lp" type="password" class="field text-tx" autocomplete="current-password" required>
      </label>
      <label class="hidden gap-1 text-sm text-mu [&:not(.hidden)]:grid">Repeat password
        <input id="lp2" type="password" class="field text-tx" autocomplete="new-password">
      </label>
      <p id="lhint" class="hidden text-xs text-mu">Username 3-32 characters: letters, numbers, dots, dashes, or underscores. Password at least 8 characters.</p>
      <label class="flex items-center gap-1.5 text-sm text-mu"><input id="lshow" type="checkbox" class="accent-ac"> Show password</label>
      <p id="lmsg" class="hidden text-sm" role="alert"></p>
      <button id="lsubmit" class="btn btn-pri py-2">Sign in</button>
    </form>
  </div>

  <div id="guestBox" class="mt-4 text-center text-sm">
    <a id="guest" href="app.html" class="text-ac hover:underline">Continue without an account</a>
    <p class="mt-1 text-xs text-mu">Without an account, settings are stored only in this browser.</p>
  </div>
  <p class="mt-3 text-center text-sm"><a href="index.html" class="text-mu hover:text-tx">Back to home</a></p>
</main>
<script src="js/brand.js"></script>
<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script src="js/login.js"></script>
</body>
</html>
